<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflex Booster</title> <!--Brain Workout-->
    <link href="./assets/images/braintraining.png" rel="shortcut icon" type="image/x-icon"/>
    <!-- everything default and using `weight: 100` -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <!-- using `weight: 100, optical size: 20, dark mode and filled icons` -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,100,1,200&icon_names=favorite,home,search,settings" rel="stylesheet" />
    <!-- loads the entire Variable Font -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite,home,search,settings" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div id="history-screen" class="main-card" style="height: 80vh; display: flex; flex-direction: column" >
      <div style=" display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; " >
        <div class="title-text" style=" font-size: 1.5rem; margin: 0; text-shadow: 0 0 10px rgba(0, 255, 100, 0.4); color: #00ff6a; " > LỊCH SỬ CHƠI </div>

        <button onclick="goTo('index.html')" class="btn-close-custom"> Đóng <i class="fa-solid fa-xmark"></i> </button>
      </div>

      <div class="history-grid-layout history-header-row">
        <div style="text-align: left">THỜI GIAN</div>
        <div>CẤP ĐỘ</div>
        <div>TỔNG ĐIỂM</div>
        <div>XOÁ</div>
      </div>

      <div id="history-list"></div>
    </div>

    <div id="detail-modal" class="modal-overlay" onclick="if(event.target == this) closeModal()" >
      <div class="modal-content">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="m-0 fw-bold"><i class="fa-solid fa-memo"></i> Chi tiết Ván Chơi</h5>
          <button class="btn btn-sm btn-danger" onclick="closeModal()"> Đóng <i class="fa-solid fa-xmark"></i> </button>
        </div>
        <div class="table-responsive">
          <table class="table table-bordered table-hover text-center" style="font-size: 0.9rem" >
            <thead class="table-light">
              <tr>
                <th>Cấp độ</th>
                <th>Đề</th>
                <th>Số đã nhập</th>
                <th>Kết quả</th>
                <th>Thời gian trả lời (Giây)</th>
              </tr>
            </thead>
            <tbody id="detail-body"></tbody>
          </table>
        </div>
      </div>
    </div>
    <script src="assets/js/logic.js"></script>
  </body>
</html>
