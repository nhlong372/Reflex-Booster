<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reflex Booster</title> <!--Brain Workout-->
    <link href="./assets/images/braintraining.png" rel="shortcut icon" type="image/x-icon"/>
    <!-- everything default and using `weight: 100` -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <!-- using `weight: 100, optical size: 20, dark mode and filled icons` -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,100,1,200&icon_names=favorite,home,search,settings" rel="stylesheet" />
    <!-- loads the entire Variable Font -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=favorite,home,search,settings" rel="stylesheet" />
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body>
    <div class="main-card" style="text-align: center">
      <div class="title-text">Reflex Booster</div>
      <div class="description-text">Train your brain!!!</div>
      <!-- <div class="label-pill">By Gon Dev</div> -->
      <div class="best-score-board">
        <div class="score-text" style="font-size: 0.8rem; color: #8f9bb3; text-transform: uppercase" >
          Điểm Cao Nhất
        </div>
        <div class="score-number" style="font-size: 2.5rem; color: #fca311" id="high-score-display" >
          0
        </div>
      </div>

      <button class="btn-3d btn-cyan" onclick="goTo('game.html')">
        <span class="material-symbols-outlined">Play Circle</span> Chơi
      </button>
      <button class="btn-3d btn-yellow" onclick="goTo('history.html')">
        <span class="material-symbols-outlined">History</span> Lịch sử chơi
      </button>
    </div>

    <script src="assets/js/logic.js"></script>
    <script>
      // Hiển thị điểm cao nhất ngay ở trang chủ
      let h = JSON.parse(localStorage.getItem("fullHistory")) || [];
      let max = h.reduce((m, i) => Math.max(m, i.score), 0);
      document.getElementById("high-score-display").innerText = max;
    </script>
  </body>
</html>
